name: ai-harness

on:
  pull_request:
    paths:
      - ".agents/**"
      - ".codex/**"
      - ".github/agents/**"
      - ".github/instructions/**"
      - ".github/copilot-instructions.md"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - "AGENTS.md"
      - "Makefile"
      - "README.md"
      - "docs/agents/**"
      - "scripts/check-agent-pipeline.py"
      - "scripts/check-agent-skills.py"
      - "scripts/review-evidence.py"
      - "tests/ai_harness/**"
      - "docs/ai-harness.md"
      - "docs/decisions/**"
      - ".github/workflows/ai-harness.yml"
  push:
    branches:
      - main
    paths:
      - ".agents/**"
      - ".codex/**"
      - ".github/agents/**"
      - ".github/instructions/**"
      - ".github/copilot-instructions.md"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - "AGENTS.md"
      - "Makefile"
      - "README.md"
      - "docs/agents/**"
      - "scripts/check-agent-pipeline.py"
      - "scripts/check-agent-skills.py"
      - "scripts/review-evidence.py"
      - "tests/ai_harness/**"
      - "docs/ai-harness.md"
      - "docs/decisions/**"
      - ".github/workflows/ai-harness.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-harness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate AI harness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate harness and collect deterministic evidence
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: make ai-harness-check
      - name: Show evidence summary
        if: always()
        run: cat /tmp/home-server-review-evidence.json || true

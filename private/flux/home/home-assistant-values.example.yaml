apiVersion: v1
kind: Secret
metadata:
  name: homeassist-values
  namespace: homeassistant
type: Opaque
stringData:
  values.yaml: |
    config:
      existingSecret: homeassist-config
      key: configuration.yaml
      defaultMode: 511
    ingress:
      hosts:
      - host: homeassistant.home.example
        paths:
        - path: /
          pathType: ImplementationSpecific
      tls:
      - secretName: home-assistant-tls
        hosts:
        - homeassistant.home.example
    oauth2Proxy:
      enabled: true
      endpointIP: 192.0.2.10
      logout:
        enabled: true
        redirectUrl: https://status.home.example/
    networkPolicy:
      enabled: true
    forwardedHeaders:
      stripForHomeAssistant:
        enabled: true
    einkDashboardIngress:
      localOnly:
        enabled: true
        sourceRanges:
          # Substitute the real trusted, IoT, and homelab VLAN ranges only in
          # the SOPS-encrypted values. Traefik applies this allow-list to the
          # direct connection source address.
          - 192.0.2.0/24 # trusted devices (example)
          - 198.51.100.0/24 # IoT and e-paper devices (example)
          - 203.0.113.0/24 # homelab (example)

apiVersion: v1
kind: Secret
metadata:
  name: manual-worker-power
  namespace: manual-worker-lifecycle-system
type: Opaque
stringData:
  nodes.env: |
    MARVIN_SSH_HOST="marvin.home.example"
    MARVIN_SSH_USER="manual-worker-lifecycle"
    MARVIN_SSH_HOST_KEY="marvin.example ssh-ed25519 AAAA..."

    MILLIARD_SSH_HOST="milliard.home.example"
    MILLIARD_SSH_USER="manual-worker-lifecycle"
    MILLIARD_SSH_HOST_KEY="milliard.example ssh-ed25519 AAAA..."
  ssh_public_key: |
    ssh-ed25519 AAAA... manual-worker-lifecycle
  ssh_private_key: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    example
    -----END OPENSSH PRIVATE KEY-----

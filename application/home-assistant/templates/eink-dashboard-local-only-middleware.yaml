{{- if and .Values.einkDashboardIngress.enabled .Values.einkDashboardIngress.localOnly.enabled }}
{{- $sourceRanges := required "einkDashboardIngress.localOnly.sourceRanges must be set when local access is enabled" .Values.einkDashboardIngress.localOnly.sourceRanges }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "home-assistant.fullname" . }}-eink-dashboard-local-only
  labels:
    {{- include "home-assistant.labels" . | nindent 4 }}
spec:
  ipAllowList:
    sourceRange:
      {{- toYaml $sourceRanges | nindent 6 }}
{{- end }}

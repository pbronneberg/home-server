apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: manual-worker-lifecycle-system
resources:
  - namespace.yaml
  - rbac.yaml
  - cronjob.yaml
configMapGenerator:
  - name: manual-worker-lifecycle
    files:
      - reconcile.sh
generatorOptions:
  disableNameSuffixHash: true

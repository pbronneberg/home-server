apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: daily-volume-backup
  namespace: longhorn-system
spec:
  concurrency: 1
  cron: "17 2 * * *"
  labels:
    backup-policy: daily
  parameters:
    full-backup-interval: "7"
  retain: 14
  task: backup
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: prometheus-snapshot-prune
  namespace: longhorn-system
spec:
  concurrency: 1
  cron: "17 5 * * *"
  retain: 2
  task: snapshot-delete

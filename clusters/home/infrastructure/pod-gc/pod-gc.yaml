apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-gc
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pod-gc
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete", "deletecollection", "get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pod-gc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pod-gc
subjects:
  - kind: ServiceAccount
    name: pod-gc
    namespace: kube-system
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pod-gc
  namespace: kube-system
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 2
  schedule: "17 */6 * * *"
  successfulJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 600
      backoffLimit: 1
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          containers:
            - name: pod-gc
              image: alpine/k8s:1.36.2
              imagePullPolicy: IfNotPresent
              env:
                - name: HOME
                  value: /tmp
              args:
                - |
                  set -eu
                  for phase in Failed Succeeded; do
                    pass=1
                    while [ "$pass" -le 10 ]; do
                      count="$(kubectl get pods -A --field-selector="status.phase=${phase}" --no-headers 2>/dev/null | wc -l | tr -d ' ')"
                      [ "$count" -gt 0 ] || break
                      printf 'Deleting %s terminal pods in phase %s (pass %s).\n' "$count" "$phase" "$pass"
                      kubectl delete pods -A --field-selector="status.phase=${phase}" --wait=false >/dev/null
                      pass=$((pass + 1))
                    done
                  done
              command: ["/bin/sh", "-c"]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 65532
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          restartPolicy: Never
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          serviceAccountName: pod-gc
          volumes:
            - name: tmp
              emptyDir:
                medium: Memory

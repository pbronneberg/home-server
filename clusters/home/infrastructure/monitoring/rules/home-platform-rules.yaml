apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: home-platform
  namespace: monitoring
spec:
  groups:
    - name: home-platform.recording
      interval: 30s
      rules:
        - record: home:cluster_cpu_usage:ratio
          expr: |
            sum(rate(container_cpu_usage_seconds_total{container!="",image!=""}[5m]))
            /
            sum(kube_node_status_allocatable{resource="cpu"})
        - record: home:cluster_memory_usage:ratio
          expr: |
            sum(container_memory_working_set_bytes{container!="",image!=""})
            /
            sum(kube_node_status_allocatable{resource="memory"})
        - record: home:workload_restarts:1h
          expr: sum(increase(kube_pod_container_status_restarts_total[1h]))
        - record: home:longhorn_volume_usage:ratio
          expr: longhorn_volume_usage_bytes / longhorn_volume_capacity_bytes
        - record: home:flux_not_ready:count
          expr: sum(gotk_resource_info{ready!="True"})
        - record: home:certificate_min_expiry_seconds
          expr: min(certmanager_certificate_expiration_timestamp_seconds - time())
        - record: home:unexpected_targets_down:count
          expr: |
            count(
              label_replace(up, "node_ip", "$1", "instance", "([^:]+)(:[0-9]+)?") == 0
              unless on(node_ip)
              label_replace(
                kube_node_annotations{annotation_home_server_dev_shutdown_phase="powered-off"}
                * on(node) group_left(internal_ip) kube_node_info,
                "node_ip", "$1", "internal_ip", "(.+)"
              )
            )
        - record: home:terminated_pods:count
          expr: sum(kube_pod_status_phase{phase=~"Failed|Succeeded"} == 1)
    - name: home-platform.alerts
      rules:
        - alert: HomePublicGrafanaUnavailable
          expr: probe_success{service="grafana"} == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Public Grafana endpoint is unavailable
            description: The blackbox probe for grafana.bronneberg.org has failed for five minutes.
        - alert: HomeFluxResourceNotReady
          expr: gotk_resource_info{ready!="True",suspended!="true"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Flux resource is not ready
            description: '{{ $labels.customresource_kind }} {{ $labels.exported_namespace }}/{{ $labels.name }} is not ready.'
        - alert: HomeCertificateExpiringSoon
          expr: certmanager_certificate_expiration_timestamp_seconds - time() < 14 * 24 * 3600
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: Certificate expires within 14 days
            description: Certificate {{ $labels.namespace }}/{{ $labels.name }} is nearing expiry.
        - alert: AlwaysOnNodeNotReady
          expr: kube_node_status_condition{node="deepthought",condition="Ready",status="true"} == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: Always-on node is not ready
            description: The permanent control-plane and storage node deepthought has not been Ready for ten minutes.
        - alert: HomeNodeRootFilesystemLow
          expr: |
            node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}
            /
            node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}
            < 0.15
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: Node root filesystem is low
            description: Node {{ $labels.instance }} has less than 15% free on its root filesystem; image pulls may trigger kubelet eviction.
        - alert: HomeTerminatedPodsAccumulating
          expr: home:terminated_pods:count > 500
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: Terminated pods are accumulating
            description: More than 500 Failed or Succeeded pods remain and can retain logs or API state.
        - alert: ManualWorkerLifecycleFailed
          expr: max by (namespace) (kube_job_status_failed{namespace="manual-worker-lifecycle-system",job_name=~"manual-worker-lifecycle-.*"} > 0)
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Manual worker lifecycle reconciliation failed
            description: Inspect the latest manual-worker-lifecycle Job before retrying a shutdown request.
        - alert: ManualWorkerLifecycleBlocked
          expr: kube_node_annotations{annotation_home_server_dev_shutdown_phase="blocked"} == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Manual worker shutdown is safety-blocked
            description: Inspect the node shutdown annotations and resolve the reason before cancelling or re-requesting shutdown.
        - alert: ManualWorkerLifecycleNotRunning
          expr: |
            absent(kube_job_created{namespace="manual-worker-lifecycle-system",job_name=~"manual-worker-lifecycle-.*"})
            or time() - max(kube_job_created{namespace="manual-worker-lifecycle-system",job_name=~"manual-worker-lifecycle-.*"}) > 300
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Manual worker lifecycle controller is not running
            description: No lifecycle reconciliation Job has been created recently.
        - alert: HomeTargetDown
          expr: |
            label_replace(up, "node_ip", "$1", "instance", "([^:]+)(:[0-9]+)?") == 0
            unless on(node_ip)
            label_replace(
              kube_node_annotations{annotation_home_server_dev_shutdown_phase="powered-off"}
              * on(node) group_left(internal_ip) kube_node_info,
              "node_ip", "$1", "internal_ip", "(.+)"
            )
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Monitoring target is unexpectedly down
            description: Target {{ $labels.job }} {{ $labels.instance }} is down.

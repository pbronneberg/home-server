defaultRules:
  # K3s embeds scheduler/controller-manager/proxy differently from kubeadm, and
  # autoscaled workers are deliberately powered off. Replace these generic
  # alerts with the autoscaler-aware rules in home-platform-rules.yaml.
  disabled:
    KubeControllerManagerDown: true
    KubeSchedulerDown: true
    KubeProxyDown: true
    KubeNodeNotReady: true
    TargetDown: true

prometheus:
  prometheusSpec:
    retention: 30d
    retentionSize: 40GB
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 50Gi
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}
    podMonitorNamespaceSelector: {}
    probeSelectorNilUsesHelmValues: false
    probeSelector: {}
    probeNamespaceSelector: {}
    ruleSelectorNilUsesHelmValues: false
    ruleSelector: {}
    ruleNamespaceSelector: {}

kube-state-metrics:
  rbac:
    extraRules:
      - apiGroups: [source.toolkit.fluxcd.io]
        resources: [gitrepositories, helmrepositories, helmcharts, ocirepositories]
        verbs: [list, watch]
      - apiGroups: [kustomize.toolkit.fluxcd.io]
        resources: [kustomizations]
        verbs: [list, watch]
      - apiGroups: [helm.toolkit.fluxcd.io]
        resources: [helmreleases]
        verbs: [list, watch]
      - apiGroups: [infra.homecluster.dev]
        resources: [nodes]
        verbs: [list, watch]
  customResourceState:
    enabled: true
    config:
      spec:
        resources:
          - groupVersionKind: {group: source.toolkit.fluxcd.io, version: v1, kind: GitRepository}
            metricNamePrefix: gotk
            metrics:
              - name: resource_info
                help: Current state of a Flux GitRepository.
                each:
                  type: Info
                  info:
                    labelsFromPath: {name: [metadata, name]}
                labelsFromPath:
                  exported_namespace: [metadata, namespace]
                  suspended: [spec, suspend]
                  ready: [status, conditions, "[type=Ready]", status]
                  revision: [status, artifact, revision]
                  url: [spec, url]
          - groupVersionKind: {group: kustomize.toolkit.fluxcd.io, version: v1, kind: Kustomization}
            metricNamePrefix: gotk
            metrics:
              - name: resource_info
                help: Current state of a Flux Kustomization.
                each:
                  type: Info
                  info:
                    labelsFromPath: {name: [metadata, name]}
                labelsFromPath:
                  exported_namespace: [metadata, namespace]
                  suspended: [spec, suspend]
                  ready: [status, conditions, "[type=Ready]", status]
                  revision: [status, lastAppliedRevision]
                  source_name: [spec, sourceRef, name]
          - groupVersionKind: {group: helm.toolkit.fluxcd.io, version: v2, kind: HelmRelease}
            metricNamePrefix: gotk
            metrics:
              - name: resource_info
                help: Current state of a Flux HelmRelease.
                each:
                  type: Info
                  info:
                    labelsFromPath: {name: [metadata, name]}
                labelsFromPath:
                  exported_namespace: [metadata, namespace]
                  suspended: [spec, suspend]
                  ready: [status, conditions, "[type=Ready]", status]
                  revision: [status, history, "0", chartVersion]
                  chart_name: [spec, chart, spec, chart]
          - groupVersionKind: {group: infra.homecluster.dev, version: v1alpha1, kind: Node}
            metricNamePrefix: home_autoscaler
            metrics:
              - name: node_info
                help: Desired power state of a homelab autoscaler node.
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      node: [spec, kubernetesNodeName]
                labelsFromPath:
                  exported_namespace: [metadata, namespace]
                  resource_name: [metadata, name]
                  desired_power_state: [spec, powerState]
                  group: [metadata, labels, group]

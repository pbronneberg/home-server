prometheus:
  prometheusSpec:
    retention: 30d
    retentionSize: 40GB
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 50Gi
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}
    podMonitorNamespaceSelector: {}
    probeSelectorNilUsesHelmValues: false
    probeSelector: {}
    probeNamespaceSelector: {}

kube-state-metrics:
  rbac:
    extraRules:
      - apiGroups: [source.toolkit.fluxcd.io]
        resources: [gitrepositories, helmrepositories, helmcharts, ocirepositories]
        verbs: [list, watch]
      - apiGroups: [kustomize.toolkit.fluxcd.io]
        resources: [kustomizations]
        verbs: [list, watch]
      - apiGroups: [helm.toolkit.fluxcd.io]
        resources: [helmreleases]
        verbs: [list, watch]
  customResourceState:
    enabled: true
    config:
      spec:
        resources:
          - groupVersionKind: {group: source.toolkit.fluxcd.io, version: v1, kind: GitRepository}
            metricNamePrefix: gotk
            metrics:
              - name: resource_info
                help: Current state of a Flux GitRepository.
                each:
                  type: Info
                  info:
                    labelsFromPath: {name: [metadata, name]}
                labelsFromPath:
                  exported_namespace: [metadata, namespace]
                  suspended: [spec, suspend]
                  ready: [status, conditions, "[type=Ready]", status]
                  revision: [status, artifact, revision]
                  url: [spec, url]
          - groupVersionKind: {group: kustomize.toolkit.fluxcd.io, version: v1, kind: Kustomization}
            metricNamePrefix: gotk
            metrics:
              - name: resource_info
                help: Current state of a Flux Kustomization.
                each:
                  type: Info
                  info:
                    labelsFromPath: {name: [metadata, name]}
                labelsFromPath:
                  exported_namespace: [metadata, namespace]
                  suspended: [spec, suspend]
                  ready: [status, conditions, "[type=Ready]", status]
                  revision: [status, lastAppliedRevision]
                  source_name: [spec, sourceRef, name]
          - groupVersionKind: {group: helm.toolkit.fluxcd.io, version: v2, kind: HelmRelease}
            metricNamePrefix: gotk
            metrics:
              - name: resource_info
                help: Current state of a Flux HelmRelease.
                each:
                  type: Info
                  info:
                    labelsFromPath: {name: [metadata, name]}
                labelsFromPath:
                  exported_namespace: [metadata, namespace]
                  suspended: [spec, suspend]
                  ready: [status, conditions, "[type=Ready]", status]
                  revision: [status, history, "0", chartVersion]
                  chart_name: [spec, chart, spec, chart]

apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: public-grafana
  namespace: monitoring
spec:
  interval: 60s
  module: http_2xx
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - https://grafana.bronneberg.org/login
      labels:
        service: grafana
        exposure: public
